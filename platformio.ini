[env:papers3]
; Keep Arduino-ESP32 on the known-good 2.0.x toolchain.  Leaving this
; unpinned allows PlatformIO to silently select Arduino-ESP32 3.x, whose
; split Network/WiFi libraries currently fail to resolve Network.h here.
platform = espressif32@7.0.1
board = esp32-s3-devkitm-1
framework = arduino

monitor_speed = 115200
upload_speed = 921600

board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_opi

build_flags =
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=3
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude

lib_ldf_mode = chain+
lib_deps =
    m5stack/M5Unified @ ^0.2.5
    lvgl/lvgl @ ^8.3.11
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.0.0
